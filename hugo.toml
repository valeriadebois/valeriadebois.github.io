baseURL = 'https://valeriadebois.com/'
title = 'Valeria De Bois'
defaultContentLanguage = 'it'
defaultContentLanguageInSubdir = false
# English is set up but turned off until the English pages exist.
disableLanguages = ['en']
disableKinds = ['taxonomy', 'term', 'rss']

[languages]
  [languages.it]
    languageName = 'Italiano'
    languageCode = 'it-IT'
    weight = 1
  [languages.en]
    languageName = 'English'
    languageCode = 'en-GB'
    weight = 2

[markup.goldmark.parser.attribute]
  block = true

[markup.goldmark.renderer]
  unsafe = true

# Keep quotes and apostrophes exactly as written (the design text mixes ' and ’).
[markup.goldmark.extensions.typographer]
  disable = true

# Nav and footer links, in the design's order. Labels are shown in capitals.
[[languages.it.menus.main]]
  identifier = 'home'
  name = 'Home'
  pageRef = '/'
  weight = 10
[[languages.it.menus.main]]
  identifier = 'about'
  name = 'Chi sono'
  pageRef = '/chi-sono'
  weight = 20
[[languages.it.menus.main]]
  identifier = 'services'
  name = 'Servizi'
  pageRef = '/servizi'
  weight = 30
[[languages.it.menus.main]]
  identifier = 'blog'
  name = 'Blog'
  pageRef = '/blog'
  weight = 40
[[languages.it.menus.main]]
  identifier = 'contact'
  name = 'Contatti'
  pageRef = '/contatti'
  weight = 50
